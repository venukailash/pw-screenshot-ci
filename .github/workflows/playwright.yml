name: Playwright Tests - Screenshot on CI
on:
  push:
    branches: '**'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v7
      with:
        add-paths: |
          tests/**/*.png
        commit-message: Updated screenshots for CI environment
        title: 'Screenshots for CI environment'
        branch: $GITHUB_REF_NAME-update-snapshots
        body: 'Screenshots for CI environment'
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
