name: Playwright Tests - Screenshot on CI
on:
  push:
    branches: '**'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Setup
      run: |
        npm ci
        npx playwright install --with-deps
    - name: Test
      run: npx playwright test
    - name: Create Pull Request
      id: cpr
      uses: peter-evans/create-pull-request@v7
      with:
        add-paths: |
          tests/**/*.png
        commit-message: Updated snapshots for CI environment
        title: 'Snapshots for CI environment'
        branch: update-snapshots
        body: 'Snapshots for CI environment'
    - name: Fail on missing or changed snapshots
      if : ${{ steps.cpr.outputs.pull-request-number }}
      run: exit 1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
